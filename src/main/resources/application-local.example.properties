# Copie este arquivo para application-local.properties.
# O arquivo real está no .gitignore e não deve ser enviado ao GitHub.

server.port=8080
server.address=0.0.0.0

# PostgreSQL local usado pelo projeto
spring.datasource.url=jdbc:postgresql://localhost:5433/fut_sumula_db
spring.datasource.username=postgres
spring.datasource.password=COLOQUE_A_SENHA_DO_POSTGRES
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Outlook/Hotmail pessoal
spring.mail.host=smtp-mail.outlook.com
spring.mail.port=587
spring.mail.username=fut_sumula_pro@hotmail.com
spring.mail.password=COLOQUE_A_SENHA_DE_APLICATIVO
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=true

app.mail.from=${spring.mail.username}
app.base-url=http://localhost:8080

# Chaves locais para permitir que a aplicação inicialize.
# Não reutilize estas chaves em produção.
api.security.token.secret=chave-jwt-local-fut-sumula-torneio-2026
api.security.admin.secret=chave-admin-local-fut-sumula-torneio-2026
api.integracao.racha.key=chave-integracao-local

# Valores locais apenas para inicializar o bean do Cloudinary.
# Substitua pelos seus valores reais somente quando testar upload de imagens.
cloudinary.cloud_name=local
cloudinary.api_key=local
cloudinary.api_secret=local
