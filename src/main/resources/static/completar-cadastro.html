<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Cadastro | Fut-Súmula Torneio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --primary-neon: #ffd700; --bg-dark: #050505; }
        body { 
            background-image: url('https://images.unsplash.com/photo-1522778119026-d647f0565c6d?q=80&w=1920&auto=format&fit=crop'); 
            background-size: cover; background-position: center; background-attachment: fixed; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; 
        }
        .overlay-bg { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: -1; }
        .login-card { 
            width: 100%; max-width: 450px; padding: 40px 30px; border: 1px solid rgba(255, 215, 0, 0.3); box-shadow: 0 0 60px rgba(0,0,0,0.8); 
            background: linear-gradient(145deg, rgba(20,20,20,0.95), rgba(10,10,10,0.98)); position: relative; overflow: hidden; border-radius: 16px; animation: slideUp 0.5s ease-out; 
        }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary-neon); }
        .login-header { text-align: center; margin-bottom: 25px; }
        .neon-text { font-size: 1.6rem; letter-spacing: 2px; font-weight: 900; margin: 0; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px var(--primary-neon); }
        .login-header p { color: #aaa; font-size: 0.85rem; margin-top: 8px; line-height: 1.4; }
        .input-game-wrapper { text-align: left; width: 100%; margin-bottom: 15px; }
        .input-game-wrapper label { display: block; color: var(--primary-neon); font-size: 0.7rem; font-weight: 900; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; padding-left: 5px; }
        .input-box { position: relative; display: flex; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; transition: all 0.3s ease; }
        .input-icon { position: absolute; left: 15px; font-size: 1.1rem; color: #666; transition: 0.3s; }
        .input-box input, .input-box select { width: 100%; background: transparent; border: none; color: #fff; padding: 12px 15px 12px 45px; font-size: 0.9rem; font-weight: 600; outline: none; appearance: none; cursor: pointer; }
        .input-box:focus-within { border-color: var(--primary-neon); background: rgba(255, 215, 0, 0.05); box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }
        .input-box:focus-within .input-icon { color: var(--primary-neon); }
        .btn-neon { width: 100%; padding: 15px; border: none; border-radius: 8px; margin-top: 15px; background: transparent; border: 1px solid var(--primary-neon); color: var(--primary-neon); font-weight: 800; font-size: 1rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-neon:hover { background: var(--primary-neon); color: #000; box-shadow: 0 0 20px var(--primary-neon); transform: translateY(-2px); }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="overlay-bg"></div>

    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-user-check" style="color: var(--primary-neon); font-size: 2.5rem; margin-bottom: 10px;"></i>
            <h2 class="neon-text">QUASE LÁ!</h2>
            <p>Por questões de segurança, precisamos que você atualize os dados da sua organização.</p>
        </div>

        <div class="input-game-wrapper">
            <label>PAÍS</label>
            <div class="input-box" style="padding-right: 15px;">
                <i class="bi bi-globe-americas input-icon"></i>
                <select id="regPais">
                    <option value="BR" style="color: #000;">🇧🇷 Brasil</option>
                    <option value="PT" style="color: #000;">🇵🇹 Portugal</option>
                    <option value="US" style="color: #000;">🇺🇸 Estados Unidos</option>
                    <option value="ES" style="color: #000;">🇪🇸 Espanha</option>
                    <option value="AR" style="color: #000;">🇦🇷 Argentina</option>
                    <option value="MX" style="color: #000;">🇲🇽 México</option>
                    <option value="OUTRO" style="color: #000;">🌍 Outro</option>
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-game-wrapper" style="width: 120px;">
                <label>ESTADO (UF)</label>
                <div class="input-box" style="padding-right: 15px;">
                    <i class="bi bi-map input-icon"></i>
                    <select id="regEstado" onchange="carregarCidades()">
                        <option value="" style="color: #000;">--</option>
                    </select>
                </div>
            </div>
            <div class="input-game-wrapper" style="flex: 2;">
                <label>CIDADE</label>
                <div class="input-box" style="padding-right: 15px;">
                    <i class="bi bi-geo-alt-fill input-icon"></i>
                    <select id="regCidade" disabled>
                        <option value="" style="color: #000;">Selecione um Estado</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="input-game-wrapper">
            <label>WHATSAPP (CONTATO)</label>
            <div class="input-box">
                <i class="bi bi-whatsapp input-icon"></i>
                <input type="text" id="regContato" placeholder="(XX) 9XXXX-XXXX" maxlength="15" onkeyup="mascaraTelefone(this)">
            </div>
        </div>

        <!-- O TYPE BUTTON IMPEDE QUE O NAVEGADOR RECARREGUE A TELA AO CLICAR -->
        <button type="button" class="btn-neon" onclick="completarDados()">
            SALVAR E ACESSAR O JOGO <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script>
        // SEGURANÇA E CONFLITO DE CHAVES RESOLVIDO
        function getToken() {
            return localStorage.getItem('futSumulaToken') || localStorage.getItem('token') || localStorage.getItem('jwtToken');
        }

        window.onload = function() {
            const token = getToken();
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
            carregarEstados();
        };

        async function carregarEstados() {
            const selectEstado = document.getElementById('regEstado');
            try {
                const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
                const estados = await response.json();
                estados.forEach(estado => {
                    const option = document.createElement('option');
                    option.value = estado.sigla; 
                    option.text = estado.sigla;  
                    option.style.color = '#000'; 
                    selectEstado.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar estados: ", error);
            }
        }

        async function carregarCidades() {
            const uf = document.getElementById('regEstado').value;
            const selectCidade = document.getElementById('regCidade');
            selectCidade.innerHTML = '';
            if(!uf) {
                selectCidade.innerHTML = '<option style="color: #000;">Selecione um Estado</option>';
                selectCidade.disabled = true;
                return;
            }
            selectCidade.disabled = false;
            selectCidade.innerHTML = '<option value="" style="color: #000;">Carregando...</option>';

            try {
                const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);
                const cidades = await response.json();
                selectCidade.innerHTML = '<option value="" style="color: #000;">Selecione a cidade</option>';
                cidades.forEach(cidade => {
                    const option = document.createElement('option');
                    option.value = cidade.nome; 
                    option.text = cidade.nome;
                    option.style.color = '#000';
                    selectCidade.appendChild(option);
                });
            } catch (error) {
                selectCidade.innerHTML = '<option value="" style="color: #000;">Erro ao carregar</option>';
            }
        }

        function mascaraTelefone(i) {
            let v = i.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d)(\d{4})$/, "$1-$2");
            i.value = v;
        }

        async function completarDados() {
            const pais = document.getElementById('regPais').value;
            const uf = document.getElementById('regEstado').value;
            const cidade = document.getElementById('regCidade').value;
            const whatsapp = document.getElementById('regContato').value;

            if (!pais || !uf || !cidade || !whatsapp) {
                alert("Por favor, preencha todos os campos corretamente.");
                return;
            }

            const btn = document.querySelector('.btn-neon');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> SALVANDO...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/completar-cadastro', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + getToken()
                    },
                    body: JSON.stringify({ pais, uf, cidade, whatsapp })
                });

                if (res.ok) {
                    window.location.href = 'index.html'; 
                } else {
                    const txt = await res.text();
                    alert("Erro ao salvar dados: " + txt);
                    btn.innerHTML = 'SALVAR E ACESSAR O JOGO <i class="fas fa-arrow-right"></i>';
                    btn.disabled = false;
                }
            } catch (e) {
                console.error(e);
                alert("Erro de conexão com o servidor.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
