<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script>
        (function() {
            const token = localStorage.getItem('voleiSumulaToken');
            if (!token) { window.location.href = '../login.html'; return; }
            const originalFetch = window.fetch;
            window.fetch = function() {
                let args = Array.from(arguments);
                args[1] = args[1] || {};
                if (args[0].includes('/api/')) { 
                    args[1].headers = args[1].headers || {}; 
                    args[1].headers['usuario-id'] = '1'; 
                }
                return originalFetch.apply(this, args);
            };
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa do Mundo | SumulaPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> 
    
    <style>
        body { background-image: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.98)), url('../images/manchete.png') !important; background-size: cover !important; background-attachment: fixed !important; }
        .content-wrapper { padding: 20px; width: 100%; max-width: 1200px; margin: 0 auto; padding-bottom: 120px; }
        
        .btn-action { background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(0,240,255,0.4); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,240,255,0.6); }

        .header-torneio { background: rgba(0,0,0,0.6); border: 1px solid rgba(255, 215, 0, 0.5); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .trophy-container { font-size: 4.5rem; text-shadow: 0 0 30px rgba(255,215,0,0.6); }
        .header-info { flex: 1; }
        .torneio-nome { font-size: 2rem; font-weight: 900; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .badge { font-size: 0.8rem; font-weight: 900; padding: 5px 10px; border-radius: 6px; text-transform: uppercase; background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.4); letter-spacing: 1px;}

        /* NAVEGAÇÃO ENTRE FASES */
        .fase-nav { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px;}
        .tab-btn { background: transparent; border: 1px solid #555; color: #aaa; padding: 12px 30px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 1rem; text-transform: uppercase;}
        .tab-btn.active { background: rgba(255,215,0,0.2); border-color: #ffd700; color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ESTILO DOS GRUPOS */
        .groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; }
        .group-box { background: rgba(15,23,42,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .group-title { background: linear-gradient(90deg, rgba(255,215,0,0.2), transparent); color: #ffd700; font-weight: 900; text-transform: uppercase; padding: 15px; font-size: 1.2rem; border-bottom: 1px solid rgba(255,215,0,0.3); display: flex; align-items: center; gap: 10px;}
        
        table { width: 100%; border-collapse: collapse; color: #fff; }
        th { background: rgba(0,0,0,0.4); padding: 12px 8px; font-size: 0.7rem; color: #aaa; text-transform: uppercase; text-align: center; }
        .th-left { text-align: left; }
        td { padding: 10px 8px; text-align: center; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .td-left { text-align: left; display: flex; align-items: center; gap: 10px; font-weight: bold; text-transform: uppercase; }
        tr:hover td { background: rgba(255,255,255,0.05); }
        
        .zone-classify { border-left: 4px solid #00ff2a; background: rgba(0,255,42,0.05); }
        .zone-out { border-left: 4px solid #ff4444; opacity: 0.7;}

        .crest-mini { width: 30px; height: 30px; position: relative; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .crest-shape { width: 100%; height: 100%; position: absolute; border-radius: 4px; z-index: 1; }
        .shape-shield { clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%); }
        .shape-round { border-radius: 50%; }
        .crest-mascot { z-index: 2; position: relative; font-size: 0.9rem; }
        .team-img-mini { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #fff; }

        /* ESTILOS DO MATA-MATA (CHAVEAMENTO) */
        .bracket-wrapper { display: flex; gap: 40px; padding: 20px 0; overflow-x: auto; align-items: stretch; justify-content: flex-start; min-height: 500px;}
        .bracket-col { display: flex; flex-direction: column; justify-content: space-around; gap: 20px; flex: 1; min-width: 250px; position: relative; }
        
        .phase-name { color: #ffd700; font-weight: 900; text-align: center; margin-bottom: 15px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; border-bottom: 2px solid #ffd700;}
        
        .matchup-box { background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; z-index: 2; margin-bottom: 15px;}
        .matchup-team { padding: 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; }
        .matchup-team:last-child { border-bottom: none; }
        .matchup-team.winner { background: rgba(0,255,42,0.15); border-left: 3px solid #00ff2a; }
        
        .team-label { font-size: 0.8rem; font-weight: 800; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .team-score { font-size: 1.1rem; font-weight: 900; color: #fff; background: rgba(0,0,0,0.6); padding: 3px 10px; border-radius: 4px; min-width: 30px; text-align: center; border: 1px solid rgba(255,255,255,0.1);}
        .winner .team-score { color: #00ff2a; border-color: #00ff2a;}
        
        .placeholder-team { color: #888; font-style: italic; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="topbar-container"></div>
    
    <main class="content-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button onclick="window.location.href='../torneios.html'" style="background:transparent; border:none; color:#ffd700; font-size:1.2rem; cursor:pointer;"><i class="fas fa-arrow-left"></i> Voltar</button>
            <button onclick="irParaCalendario()" class="btn-action" style="background: rgba(255,215,0,0.2); border: 1px solid #ffd700; color: #ffd700; box-shadow: none;">
                <i class="fas fa-calendar-alt"></i> ACESSAR JOGOS (SÚMULA)
            </button>
        </div>

        <div id="loading" style="text-align: center; color: #ffd700; padding: 50px;"><i class="fas fa-spinner fa-spin fa-2x"></i> Processando Copa...</div>

        <div id="torneio-content" style="display: none;">
            <div class="header-torneio">
                <div class="trophy-container" id="head-trophy"><i class="fas fa-globe-americas"></i></div>
                <div class="header-info">
                    <div class="torneio-nome" id="head-nome">CARREGANDO...</div>
                    <span class="badge" id="head-tipo"><i class="fas fa-globe"></i> MUNDIAL (COPA)</span>
                    <span class="badge" id="head-qtd" style="margin-left: 10px; background: rgba(0,240,255,0.1); color: #00f0ff; border-color: rgba(0,240,255,0.3);"><i class="fas fa-shield-alt"></i> 0 EQUIPES</span>
                </div>
            </div>

            <div class="fase-nav">
                <button class="tab-btn active" onclick="switchTab('grupos', this)"><i class="fas fa-th-large"></i> Fase de Grupos</button>
                <button class="tab-btn" onclick="switchTab('matamata', this)"><i class="fas fa-sitemap"></i> Fase Final (Playoffs)</button>
            </div>

            <div id="tab-grupos" class="tab-content active">
                <div class="groups-grid" id="grupos-container">
                    </div>
            </div>
            
            <div id="tab-matamata" class="tab-content">
                <div class="bracket-wrapper" id="bracket-container">
                    </div>
            </div>
        </div>
    </main>

    <script>
        const mascotMap = { 'volleyball': 'fa-volleyball-ball', 'bolt': 'fa-bolt', 'fire': 'fa-fire', 'star': 'fa-star', 'crown': 'fa-crown', 'eagle': 'fa-feather-alt', 'lion': 'fa-paw', 'shield': 'fa-shield-alt', 'fist': 'fa-fist-raised', 'meteor': 'fa-meteor', 'mountain': 'fa-mountain', 'sun': 'fa-sun' };
        const trophyModels = ['fa-trophy', 'fa-award', 'fa-medal', 'fa-crown', 'fa-star', 'fa-shield-alt', 'fa-wine-glass', 'fa-gem', 'fa-ribbon', 'fa-certificate'];
        
        let torneioIdGlobal = null;

        function getEscudoHTML(t, size=30) {
            if (!t) return `<div class="crest-mini" style="width:${size}px;height:${size}px;opacity:0.3;"><i class="fas fa-question-circle" style="color:#555;"></i></div>`;
            if (t.tipoEscudo === 'UPLOAD' && t.escudoUrl) return `<img src="${t.escudoUrl}" class="team-img-mini" style="width:${size}px;height:${size}px;">`;
            
            const c1 = t.corPrimaria || '#333'; const c2 = t.corSecundaria || '#111'; const c3 = t.corTerciaria || '#fff';
            let icon = t.customMascot ? (mascotMap[t.customMascot] || 'fa-volleyball-ball') : 'fa-volleyball-ball';
            return `
                <div class="crest-mini" style="width:${size}px;height:${size}px;">
                    <div class="crest-shape shape-${t.customShape || 'shield'}" style="background:linear-gradient(135deg, ${c1}, ${c2}); border: 1px solid ${c3};"></div>
                    <i class="fas ${icon} crest-mascot" style="color:${c3 === '#ffffff' ? '#fff' : c3}; font-size:${size*0.4}px;"></i>
                </div>`;
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function irParaCalendario() {
            if(torneioIdGlobal) window.location.href = `../playhub.html?id=${torneioIdGlobal}`;
        }

        async function carregarCopa() {
            const urlParams = new URLSearchParams(window.location.search);
            torneioIdGlobal = urlParams.get('id');
            if(!torneioIdGlobal) { window.location.href = '../torneios.html'; return; }

            try {
                const resT = await fetch(`/api/torneios/${torneioIdGlobal}`);
                const torneio = await resT.json();
                const resP = await fetch('/api/partidas');
                const todasPartidas = await resP.json();
                const partidas = todasPartidas.filter(p => p.torneio && p.torneio.id === torneio.id);

                // Setup do Cabeçalho
                document.getElementById('head-nome').innerText = torneio.nome;
                document.getElementById('head-qtd').innerHTML = `<i class="fas fa-shield-alt"></i> ${torneio.quantidadeTimes} EQUIPES`;
                const color = torneio.corTrofeu || '#ffd700';
                const iconEl = document.getElementById('head-trophy');
                iconEl.innerHTML = `<i class="fas ${trophyModels[(torneio.modeloTrofeu || 1) - 1]}"></i>`;
                iconEl.style.color = color;

                // Separar as partidas
                const partidasGrupos = partidas.filter(p => p.fase && p.fase.includes('GRUPO'));
                const partidasMataMata = partidas.filter(p => !p.fase || !p.fase.includes('GRUPO'));

                processarFaseGrupos(partidasGrupos);
                processarMataMata(partidasMataMata, torneio);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('torneio-content').style.display = 'block';
            } catch (e) { alert("Erro ao carregar Copa. Verifique o servidor."); console.error(e);}
        }

        // --- INTELIGÊNCIA: FASE DE GRUPOS ---
        function processarFaseGrupos(partidas) {
            const container = document.getElementById('grupos-container');
            container.innerHTML = '';
            
            // Descobrir quais grupos existem (GRUPO A, GRUPO B...)
            const gruposNomes = [...new Set(partidas.map(p => p.fase))].sort();

            gruposNomes.forEach(grupoNome => {
                const jogosDoGrupo = partidas.filter(p => p.fase === grupoNome);
                const stats = {};

                // Inicializar e Calcular Pontos (Regra FIVB)
                jogosDoGrupo.forEach(p => {
                    [p.timeCasa, p.timeVisitante].forEach(t => {
                        if(t && !stats[t.id]) stats[t.id] = { t, j:0, v:0, d:0, pts:0, sg:0, sp:0 };
                    });
                    if(p.status === 'FINALIZADO') {
                        const c = p.timeCasa.id, v = p.timeVisitante.id;
                        stats[c].j++; stats[v].j++;
                        stats[c].sg += p.setsCasa; stats[c].sp += p.setsVisitante;
                        stats[v].sg += p.setsVisitante; stats[v].sp += p.setsCasa;
                        if (p.setsCasa > p.setsVisitante) { stats[c].v++; stats[v].d++; stats[c].pts += (p.setsVisitante === 2 ? 2 : 3); if(p.setsVisitante === 2) stats[v].pts += 1; }
                        else { stats[v].v++; stats[c].d++; stats[v].pts += (p.setsCasa === 2 ? 2 : 3); if(p.setsCasa === 2) stats[c].pts += 1; }
                    }
                });

                // Ordenação: Pontos > Vitórias > Set Ratio
                const tabela = Object.values(stats).map(s => {
                    s.sr = s.sp === 0 ? (s.sg===0?0:99) : (s.sg/s.sp);
                    return s;
                }).sort((a,b) => b.pts !== a.pts ? b.pts - a.pts : b.v !== a.v ? b.v - a.v : b.sr - a.sr);

                let rows = tabela.map((row, i) => {
                    const statusClass = i < 2 ? 'zone-classify' : 'zone-out'; // Top 2 passam na Copa
                    return `
                    <tr class="${statusClass}">
                        <td><strong>${i + 1}º</strong></td>
                        <td class="td-left">${getEscudoHTML(row.t, 25)} <span>${row.t.nome}</span></td>
                        <td style="color:#ffd700; font-weight:900;">${row.pts}</td>
                        <td>${row.j}</td><td style="color:#00ff2a;">${row.v}</td><td style="color:#ff4444;">${row.d}</td>
                        <td>${row.sg}</td><td>${row.sp}</td>
                    </tr>`;
                }).join('');

                container.innerHTML += `
                    <div class="group-box">
                        <div class="group-title"><i class="fas fa-layer-group"></i> ${grupoNome}</div>
                        <table>
                            <thead><tr><th>POS</th><th class="th-left">CLUBE</th><th>PTS</th><th>J</th><th>V</th><th>D</th><th>SG</th><th>SP</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
            });
        }

        // --- INTELIGÊNCIA: ÁRVORE DO MATA-MATA ---
        function processarMataMata(partidas, torneio) {
            const container = document.getElementById('bracket-container');
            container.innerHTML = '';
            if(partidas.length === 0) {
                container.innerHTML = `<div style="text-align:center; width:100%; color:#aaa; padding: 50px;">O Mata-Mata será gerado pelo sistema.</div>`;
                return;
            }

            // Agrupa por fases na ordem lógica
            const order = ["OITAVAS", "OITAVAS DE FINAL", "QUARTAS", "QUARTAS DE FINAL", "SEMIFINAL", "FINAL", "GRANDE FINAL"];
            const fases = [...new Set(partidas.map(p => p.fase))].sort((a, b) => {
                // Encontra a posição aproximada no array de ordem
                const posA = order.findIndex(o => a && a.toUpperCase().includes(o));
                const posB = order.findIndex(o => b && b.toUpperCase().includes(o));
                return (posA !== -1 ? posA : 99) - (posB !== -1 ? posB : 99);
            });

            // Constrói as colunas do Bracket
            fases.forEach(faseNome => {
                if(!faseNome) return;
                const col = document.createElement('div');
                col.className = 'bracket-col';
                col.innerHTML = `<div class="phase-name">${faseNome}</div>`;

                const jogosFase = partidas.filter(p => p.fase === faseNome);
                jogosFase.forEach(p => {
                    const isFin = p.status === 'FINALIZADO';
                    const winCasa = isFin && p.setsCasa > p.setsVisitante;
                    const winVis = isFin && p.setsVisitante > p.setsCasa;
                    
                    let lblA = p.labelConfronto ? p.labelConfronto.split(' x ')[0] : 'A Definir';
                    let lblB = p.labelConfronto ? p.labelConfronto.split(' x ')[1] : 'A Definir';

                    col.innerHTML += `
                        <div class="matchup-box">
                            <div class="matchup-team ${winCasa ? 'winner' : ''}">
                                ${getEscudoHTML(p.timeCasa, 25)}
                                <div class="team-label ${!p.timeCasa ? 'placeholder-team' : ''}">${p.timeCasa?.nome || lblA}</div>
                                <div class="team-score">${isFin ? p.setsCasa : '-'}</div>
                            </div>
                            <div class="matchup-team ${winVis ? 'winner' : ''}">
                                ${getEscudoHTML(p.timeVisitante, 25)}
                                <div class="team-label ${!p.timeVisitante ? 'placeholder-team' : ''}">${p.timeVisitante?.nome || lblB}</div>
                                <div class="team-score">${isFin ? p.setsVisitante : '-'}</div>
                            </div>
                        </div>`;
                });
                container.appendChild(col);
            });
        }

        carregarCopa();
    </script>
</body>
</html>
