<script>
    // Função Global para abrir menus
    window.toggleMenu = function(menuId, btnElement) {
        const allMenus = document.querySelectorAll('.float-menu');
        const allBtns = document.querySelectorAll('.nav-item');
        const menu = document.getElementById(menuId);
        
        if (!menu) return;

        const isOpen = menu.classList.contains('show');

        allMenus.forEach(m => m.classList.remove('show'));
        allBtns.forEach(b => b.classList.remove('active'));

        if (!isOpen) {
            menu.classList.add('show');
            btnElement.classList.add('active');
        } else {
            window.highlightCurrentPage();
        }
    };

    // Destaca a página atual
    window.highlightCurrentPage = function() {
        const path = window.location.pathname;
        const homeBtn = document.getElementById('nav-home');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

        if (path.includes("index") || path === "/") {
            if(homeBtn) homeBtn.classList.add('active');
        }
    };

    window.highlightCurrentPage();

    // Fecha ao clicar fora
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.app-footbar') && !e.target.closest('.float-menu')) {
            document.querySelectorAll('.float-menu').forEach(m => m.classList.remove('show'));
            window.highlightCurrentPage();
        }
    });
</script>
