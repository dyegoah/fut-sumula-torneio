<div id="globalShareModal" class="share-global-modal">
    <div class="share-global-box">
        <div style="position: absolute; top: 10px; right: 15px; cursor: pointer; color: #ff4444;" onclick="document.getElementById('globalShareModal').classList.remove('active')">
            <i class="fas fa-times" style="font-size: 1.2rem;"></i>
        </div>
        <i class="fas fa-broadcast-tower" style="font-size: 2.5rem; color: var(--primary-neon); margin-bottom: 10px;"></i>
        <h3 style="margin: 0 0 10px 0; color: #fff;">COMPARTILHAR TORNEIO</h3>
        <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 15px;">Selecione o torneio para gerar o link da página pública (Tabela, Súmulas e Stats).</p>
        
        <select id="share-tourney-select" style="width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 8px; margin-bottom: 15px;">
            <option value="">Carregando torneios...</option>
        </select>

        <div class="social-btn-grid">
            <button class="btn-soc bg-wa" onclick="window.sharePublico('whatsapp')"><i class="fab fa-whatsapp"></i> WhatsApp</button>
            <button class="btn-soc bg-fb" onclick="window.sharePublico('facebook')"><i class="fab fa-facebook-f"></i> Facebook</button>
            <button class="btn-soc bg-em" onclick="window.sharePublico('email')"><i class="fas fa-envelope"></i> E-mail</button>
            <button class="btn-soc bg-ig" onclick="window.sharePublico('instagram')"><i class="fab fa-instagram"></i> Instagram</button>
            <button class="btn-soc bg-tk" onclick="window.sharePublico('tiktok')"><i class="fab fa-tiktok"></i> TikTok</button>
            <button class="btn-soc bg-kw" onclick="window.sharePublico('kwai')"><i class="fas fa-video"></i> Kwai</button>
            <button class="btn-soc bg-cp" onclick="window.sharePublico('copy')"><i class="fas fa-link"></i> COPIAR LINK OFICIAL</button>
        </div>
    </div>
</div>

<script>
    // PADRONIZAÇÃO GLOBAL DE TOKENS: O Footbar vai ensinar as outras páginas a pegar o token certo!
    window.getTokenGlobal = function() {
        return localStorage.getItem('futSumulaToken') || localStorage.getItem('token') || localStorage.getItem('jwtToken');
    };

    window.toggleMenu = function(menuId, btnElement) {
        const allMenus = document.querySelectorAll('.float-menu');
        const allBtns = document.querySelectorAll('.nav-item');
        const menu = document.getElementById(menuId);
        
        if (!menu) return;

        const isOpen = menu.classList.contains('show');

        allMenus.forEach(m => m.classList.remove('show'));
        allBtns.forEach(b => b.classList.remove('active'));

        if (!isOpen) {
            menu.classList.add('show');
            btnElement.classList.add('active');
        } else {
            window.highlightCurrentPage();
        }
    };

    window.highlightCurrentPage = function() {
        const path = window.location.pathname;
        const homeBtn = document.getElementById('nav-home');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

        if (path.includes("index") || path === "/") {
            if(homeBtn) homeBtn.classList.add('active');
        }
    };

    window.highlightCurrentPage();

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.app-footbar') && !e.target.closest('.float-menu') && !e.target.closest('.share-global-modal')) {
            document.querySelectorAll('.float-menu').forEach(m => m.classList.remove('show'));
            window.highlightCurrentPage();
        }
    });

    window.abrirShareGlobal = async function(e) {
        e.preventDefault(); e.stopPropagation();
        document.querySelectorAll('.float-menu').forEach(m => m.classList.remove('show'));
        document.getElementById('globalShareModal').classList.add('active');
        
        try {
            const res = await fetch('/api/torneios', {
                headers: { 'Authorization': 'Bearer ' + window.getTokenGlobal() }
            });
            if(res.ok) {
                const torneios = await res.json();
                const select = document.getElementById('share-tourney-select');
                select.innerHTML = '<option value="">Selecione o Torneio...</option>';
                torneios.forEach(t => {
                    select.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
                });
            }
        } catch(e) { console.error("Erro ao carregar torneios para share"); }
    };

    window.sharePublico = function(plataforma) {
        const select = document.getElementById('share-tourney-select');
        const tId = select.value;
        const tName = select.options[select.selectedIndex].text;
        
        if(!tId) { alert("Por favor, selecione um torneio primeiro!"); return; }

        const baseUrl = window.location.origin;
        const publicUrl = `${baseUrl}/public-torneio.html?id=${tId}`;
        
        const mensagemCompleta = `🏆 Acompanhe ao vivo o torneio *${tName}*! Tabela, Súmulas e Estatísticas oficiais:\n\n${publicUrl}`;

        if(plataforma === 'copy' || plataforma === 'instagram' || plataforma === 'tiktok' || plataforma === 'kwai') {
            navigator.clipboard.writeText(publicUrl).then(() => {
                let msgSocial = "";
                if(plataforma !== 'copy') msgSocial = `\nAbra o ${plataforma.toUpperCase()} e cole o link na sua Bio ou Stories!`;
                alert("✅ Link oficial copiado com sucesso!" + msgSocial);
            });
        } else if (plataforma === 'whatsapp') {
            window.open(`https://wa.me/?text=${encodeURIComponent(mensagemCompleta)}`, '_blank');
        } else if (plataforma === 'facebook') {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(publicUrl)}`, '_blank');
        } else if (plataforma === 'email') {
            window.open(`mailto:?subject=Acompanhe o Torneio ${encodeURIComponent(tName)}&body=${encodeURIComponent(mensagemCompleta)}`, '_self');
        }
    };
</script>
