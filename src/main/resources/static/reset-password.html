<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | Fut-Súmula Torneio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-neon: #00eaff;
            --primary-dim: rgba(0, 234, 255, 0.1);
            --bg-dark: #050505;
        }
        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background-color: #0b0b0f; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .glow-circle { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; }
        .gc-1 { width: 300px; height: 300px; background: var(--primary-neon); top: -50px; right: -50px; }
        .gc-2 { width: 200px; height: 200px; background: #0044ff; bottom: -50px; left: -50px; }

        .login-form-container {
            width: 100%; max-width: 400px; padding: 40px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; backdrop-filter: blur(20px); z-index: 10; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header i { font-size: 2.5rem; color: var(--primary-neon); margin-bottom: 10px; display: block; }
        .form-header h2 { font-size: 1.5rem; color: #fff; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .form-header p { font-size: 0.8rem; color: #666; margin-top: 5px; }

        .input-box { position: relative; margin-bottom: 20px; }
        .input-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }
        .input-box input {
            width: 100%; padding: 15px 15px 15px 45px;
            background: rgba(0,0,0,0.3); border: 1px solid #333; border-radius: 8px;
            color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s;
        }
        .input-box input:focus { border-color: var(--primary-neon); box-shadow: 0 0 10px var(--primary-dim); }
        .input-box label {
            position: absolute; left: 45px; top: 15px; color: #666; font-size: 0.9rem; pointer-events: none; transition: 0.3s;
        }
        .input-box input:focus ~ label, .input-box input:not(:placeholder-shown) ~ label {
            top: -10px; left: 10px; font-size: 0.7rem; color: var(--primary-neon); background: #0b0b0f; padding: 0 5px;
        }

        .btn-submit {
            width: 100%; padding: 15px; border: none; border-radius: 8px;
            background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; font-weight: 800; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 20px rgba(0, 114, 255, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 114, 255, 0.5); }
        .btn-submit:disabled { background: #555; cursor: not-allowed; box-shadow: none; transform: none; }
    </style>
</head>
<body>
    <div class="glow-circle gc-1"></div>
    <div class="glow-circle gc-2"></div>

    <div class="login-form-container">
        <div class="form-header">
            <i class="fas fa-key"></i>
            <h2>Nova Senha</h2>
            <p>Crie uma credencial segura para seu acesso.</p>
        </div>

        <div class="input-box">
            <i class="fas fa-lock"></i>
            <input type="password" id="novaSenha" placeholder=" " required>
            <label>Nova Senha</label>
        </div>

        <div class="input-box">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmaSenha" placeholder=" " required>
            <label>Confirme a Senha</label>
        </div>

        <button id="btnRedefinir" class="btn-submit" onclick="redefinirSenha()">
            SALVAR SENHA <i class="fas fa-check" style="margin-left:5px;"></i>
        </button>
    </div>

    <script>
        // Extrai o token da URL (Ex: ?token=UUID-AQUI)
        const urlParams = new URLSearchParams(window.location.search);
        const tokenRecuperacao = urlParams.get('token');

        // Proteção: Se não houver token na URL, expulsa a pessoa
        if (!tokenRecuperacao) {
            alert("⚠️ Link de recuperação inválido ou ausente.");
            window.location.href = 'login.html';
        }

        async function redefinirSenha() {
            const senha1 = document.getElementById('novaSenha').value;
            const senha2 = document.getElementById('confirmaSenha').value;
            const btn = document.getElementById('btnRedefinir');

            if (!senha1 || !senha2) {
                alert("Por favor, preencha as duas senhas.");
                return;
            }

            if (senha1 !== senha2) {
                alert("As senhas não coincidem. Tente novamente.");
                return;
            }

            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> SALVANDO...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenRecuperacao, novaSenha: senha1 })
                });

                const respostaServidor = await res.text();

                if (res.ok) {
                    alert("✅ " + respostaServidor);
                    window.location.href = 'login.html';
                } else {
                    alert("❌ Erro: " + respostaServidor);
                    btn.innerHTML = textoOriginal;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert("Servidor indisponível no momento.");
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
