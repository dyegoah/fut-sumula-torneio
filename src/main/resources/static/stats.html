	<script>
	    // Fiscal de Autenticação Automático
	    async function validarAcesso() {
	        try {
	            const res = await fetch('/api/auth/me', { 
	                method: 'GET',
	                credentials: 'include' // Envia o cookie HttpOnly silenciosamente
	            });
	            
	            if (!res.ok) {
	                // Se o backend disser 401 (Não autorizado) ou 403 (Proibido)
	                throw new Error("Sessão inválida ou expirada.");
	            }

	            // Opcional: Se for a página admin-panel.html, você pode validar o cargo aqui
	            // const user = await res.json();
	            // if (window.location.pathname.includes('admin-panel') && user.role !== 'ADMIN') throw new Error("Acesso negado");

	        } catch (error) {
	            console.warn(error.message);
	            // Expulsa para a tela de login
	            window.location.replace('login.html'); 
	        }
	    }
	    
	    // Executa imediatamente antes de renderizar o resto da página
	    validarAcesso();
	</script>
	<script>
	        (function() {
	            const token = localStorage.getItem('futSumulaToken');
	            if (!token) {
	                window.location.href = 'login.html';
	                return; 
	            }
	            const originalFetch = window.fetch;
	            window.fetch = function() {
	                let args = Array.from(arguments);
	                let url = args[0];
	                let options = args[1] || {};
	                if (url.includes('/api/') && !url.includes('/auth/')) {
	                    options.headers = options.headers || {};
	                    options.headers['Authorization'] = 'Bearer ' + token;
	                }
	                args[1] = options;
	                return originalFetch.apply(this, args).then(response => {
	                    if (response.status === 403 || response.status === 401) {
	                        alert("Sessão expirada. Por favor, faça login novamente.");
	                        localStorage.removeItem('futSumulaToken');
	                        window.location.href = 'login.html';
	                    }
	                    return response;
	                }).catch(err => {
	                    console.error("Erro na requisição segura:", err);
	                    throw err;
	                });
	            };
	        })();
	    </script>

    <script>
		fetch('footbar.html').then(r => r.text()).then(d => {
		            const container = document.getElementById('footbar-container');
		            container.innerHTML = d;
		            
		            // Extrai e executa o script injetado de forma segura (sem eval)
		            const scripts = container.querySelectorAll("script");
		            scripts.forEach(s => {
		                const novoScript = document.createElement("script");
		                novoScript.textContent = s.textContent;
		                document.body.appendChild(novoScript);
		            });
		        });
        if (typeof AppImages === 'undefined') { var AppImages = { defaultAvatar: "https://cdn-icons-png.flaticon.com/512/21/21104.png" }; }
        const trophyIcons = ['fa-trophy', 'fa-award', 'fa-medal', 'fa-crown', 'fa-star'];
        
        let allTournaments = [];
        let currentTourneyId = null;
        let currentStatsData = []; 
        let currentStatsType = '';

        document.addEventListener('DOMContentLoaded', loadTournaments);

        async function loadTournaments() {
            try {
                const response = await fetch('/api/torneios');
                allTournaments = await response.json();
                renderTournaments(allTournaments);
            } catch(e) { console.error(e); }
        }

        function renderTournaments(list) {
            const grid = document.getElementById('tournaments-grid');
            grid.innerHTML = '';
            if(list.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#777;">Nenhum torneio encontrado.</div>'; return; }
            list.forEach(t => {
                const iconClass = trophyIcons[(t.modeloTrofeu || 1) - 1];
                const color = t.corTrofeu || '#FFD700';
                grid.innerHTML += `
                    <div class="tournament-card" onclick="openStatsModal(${t.id})">
                        <div class="t-card-header" style="background-image: var(--img-stadium);">
                            <div class="t-card-overlay"></div>
                            <div class="t-type-badge">${t.tipo.replace('_',' ')}</div>
                            <i class="fas ${iconClass}" style="position: absolute; bottom: 10px; left: 15px; font-size: 2.5rem; color: ${color}; filter: drop-shadow(0 0 10px #000);"></i>
                        </div>
                        <div class="t-card-body">
                            <div class="t-title">${t.nome}</div>
                            <div class="t-info"><span style="color:var(--primary-neon);">VER ESTATÍSTICAS <i class="fas fa-chart-bar"></i></span></div>
                        </div>
                    </div>`;
            });
        }

        function filterTournaments() {
            const term = document.getElementById('search-ph').value.toLowerCase();
            renderTournaments(allTournaments.filter(t => t.nome.toLowerCase().includes(term)));
        }

        function openStatsModal(id) {
            currentTourneyId = id;
            const t = allTournaments.find(x => x.id === id);
            const iconClass = trophyIcons[(t.modeloTrofeu || 1) - 1];
            const color = t.corTrofeu || '#FFD700';
            
            document.getElementById('stats-header').innerHTML = `
                <i class="fas ${iconClass}" style="font-size: 3rem; color: ${color}; display: block; margin: 0 auto 10px;"></i>
                <h2 class="th-title">${t.nome}</h2>
            `;
            
            document.getElementById('statsModal').classList.add('active');
            loadStats('gols');
        }

        // --- NOVO MOTOR DE ESTATÍSTICAS LOCAIS ---
        // Ele lê os dados salvos pelo "Encerrar Partida" em tempo real
        function loadStats(type) {
            currentStatsType = type;
            document.querySelectorAll('.stat-tab').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.stat-tab');
            if(type==='gols') tabs[0].classList.add('active');
            if(type==='amarelos') tabs[1].classList.add('active');
            if(type==='vermelhos') tabs[2].classList.add('active');
            if(type==='faltas') tabs[3].classList.add('active');

            const container = document.getElementById('stats-content');
            container.innerHTML = '<div style="text-align:center; padding:30px;"><i class="fas fa-circle-notch fa-spin"></i> Processando súmulas...</div>';

            setTimeout(() => {
                let playerStats = {};
                const prefix = `match_result_${currentTourneyId}_`;
                
                // Varre o localStorage em busca de todas as partidas finalizadas desse torneio
                for(let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if(key.startsWith(prefix)) {
                        const match = JSON.parse(localStorage.getItem(key));
                        if(match.eventos && Array.isArray(match.eventos)) {
                            match.eventos.forEach(ev => {
                                let isValid = false;
                                if(type === 'gols' && ev.type === 'GOAL') isValid = true;
                                if(type === 'amarelos' && ev.type === 'YELLOW') isValid = true;
                                if(type === 'vermelhos' && ev.type === 'RED') isValid = true;
                                if(type === 'faltas' && ev.type === 'FOUL') isValid = true;

                                if(isValid) {
                                    if(!playerStats[ev.playerId]) {
                                        playerStats[ev.playerId] = {
                                            nomeJogador: ev.playerName || 'Jogador Desconhecido',
                                            fotoUrl: ev.fotoUrl || AppImages.defaultAvatar,
                                            nomeTime: ev.teamName || 'Time',
                                            quantidade: 0
                                        };
                                    }
                                    playerStats[ev.playerId].quantidade++;
                                }
                            });
                        }
                    }
                }

                // Transforma em array e ordena do maior para o menor
                currentStatsData = Object.values(playerStats).sort((a,b) => b.quantidade - a.quantidade);

                let color = "var(--primary-neon)";
                if(type === 'amarelos') color = "#FFD700";
                if(type === 'vermelhos') color = "#ff4444";
                if(type === 'faltas') color = "#FF8C00";

                renderContent(currentStatsData, color);
            }, 300); // pequeno delay para animação de loading
        }

        function renderContent(list, valueColor) {
            const container = document.getElementById('stats-content');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:#888;">Nenhum registro encontrado nesta categoria. <br><small>Jogue as partidas e encerre a súmula para gerar dados.</small></div>`;
                return;
            }

            let podiumHTML = '<div class="podium-container">';
            if(list[1]) podiumHTML += createPodiumCard(list[1], 2, valueColor);
            if(list[0]) podiumHTML += createPodiumCard(list[0], 1, valueColor);
            if(list[2]) podiumHTML += createPodiumCard(list[2], 3, valueColor);
            podiumHTML += '</div>';

            container.innerHTML += podiumHTML;

            let listHTML = '<div class="stats-list">';
            for(let i = 3; i < list.length; i++) {
                const p = list[i];
                listHTML += `
                    <div class="stat-row">
                        <div class="sr-rank">${i+1}</div>
                        <div class="sr-info">
                            <img src="${p.fotoUrl || AppImages.defaultAvatar}" class="sr-img">
                            <div>
                                <div class="sr-name">${p.nomeJogador}</div>
                                <div class="sr-team">${p.nomeTime}</div>
                            </div>
                        </div>
                        <div class="sr-value" style="color:${valueColor}">${p.quantidade}</div>
                    </div>`;
            }
            listHTML += '</div>';
            container.innerHTML += listHTML;
        }

        function createPodiumCard(p, rank, color) {
            return `
                <div class="podium-card rank-${rank}">
                    <div class="rank-badge">${rank}</div>
                    <img src="${p.fotoUrl || AppImages.defaultAvatar}" class="podium-img">
                    <div class="podium-name">${p.nomeJogador}</div>
                    <div class="podium-team">${p.nomeTime}</div>
                    <div class="podium-value" style="color:${color}">${p.quantidade}</div>
                </div>`;
        }

        function openSharePreview() {
            if(!currentStatsData || currentStatsData.length === 0) {
                alert("Não há dados para compartilhar."); return;
            }

            const titles = { 'gols': 'ARTILHARIA', 'amarelos': 'CARTÕES AMARELOS', 'vermelhos': 'CARTÕES VERMELHOS', 'faltas': 'RANKING DE FALTAS' };
            const colors = { 'gols': '#00ff88', 'amarelos': '#FFD700', 'vermelhos': '#ff4444', 'faltas': '#FF8C00' };
            
            const t = allTournaments.find(x => x.id === currentTourneyId);
            const tourneyName = t ? t.nome : 'TORNEIO';
            document.getElementById('share-tourney-name').innerText = tourneyName;

            const titleEl = document.getElementById('share-title-text');
            const mainColor = colors[currentStatsType] || '#00ff88';
            titleEl.innerText = titles[currentStatsType] || 'ESTATÍSTICAS';
            titleEl.style.color = mainColor;
            titleEl.style.borderColor = mainColor;
            titleEl.style.boxShadow = `0 0 30px ${mainColor}40`; 

            const podiumArea = document.getElementById('share-podium-area');
            podiumArea.innerHTML = '';
            
            const order = [1, 0, 2];
            order.forEach(idx => {
                if(currentStatsData[idx]) {
                    const p = currentStatsData[idx];
                    const rank = idx + 1;
                    const html = `
                        <div class="share-card p-${rank}">
                            <div class="share-badge">${rank}</div>
                            <img src="${p.fotoUrl || AppImages.defaultAvatar}" class="share-img">
                            <div class="share-name">${p.nomeJogador}</div>
                            <div class="share-team">${p.nomeTime}</div>
                            <div class="share-value" style="color:${mainColor}; text-shadow: 0 0 20px ${mainColor};">${p.quantidade}</div>
                        </div>
                    `;
                    podiumArea.innerHTML += html;
                }
            });

            const listArea = document.getElementById('share-list-area');
            listArea.innerHTML = '';
            for(let i=3; i<5; i++) {
                if(currentStatsData[i]) {
                    const p = currentStatsData[i];
                    listArea.innerHTML += `
                        <div class="share-row" style="border-color:${mainColor}80;">
                            <div class="share-row-rank">${i+1}</div>
                            <img src="${p.fotoUrl || AppImages.defaultAvatar}" class="share-row-img">
                            <div class="share-row-info">
                                <div class="share-row-name">${p.nomeJogador}</div>
                                <div class="share-row-team">${p.nomeTime}</div>
                            </div>
                            <div class="share-row-val" style="color:${mainColor};">${p.quantidade}</div>
                        </div>
                    `;
                }
            }

            document.getElementById('sharePreviewModal').classList.add('active');
            const previewContainer = document.getElementById('preview-img-container');
            previewContainer.innerHTML = '<div style="padding:20px; color:#fff;">Gerando card... <i class="fas fa-spinner fa-spin"></i></div>';

            const element = document.getElementById('share-template-container');
            
            html2canvas(element, {
                scale: 1, backgroundColor: null, useCORS: true, logging: false
            }).then(canvas => {
                previewContainer.innerHTML = '';
                canvas.style.width = '100%'; canvas.style.height = 'auto'; 
                previewContainer.appendChild(canvas);

                const link = document.getElementById('download-link');
                link.href = canvas.toDataURL("image/png");
                link.download = `futsumula-stats-${currentStatsType}.png`;
            });
        }

        function shareImage(platform) {
            const canvas = document.querySelector('#preview-img-container canvas');
            if(!canvas) return;

            canvas.toBlob(async (blob) => {
                const file = new File([blob], `futsumula-stats.png`, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Estatísticas Fut-Súmula',
                            text: 'Confira as estatísticas do torneio!'
                        });
                    } catch (err) { console.log('Compartilhamento cancelado'); }
                } else {
                    const url = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.download = 'futsumula-stats.png';
                    link.href = url;
                    link.click();
                    alert(`Imagem salva! Agora abra o ${platform} e poste a foto da sua galeria/downloads.`);
                }
            });
        }
    </script>
</body>
</html>
