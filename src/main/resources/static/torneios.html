    <!-- BLINDAGEM DE SESSÃO GLOBAL -->
    <script>
        function getTokenGlobal() {
            return localStorage.getItem('futSumulaToken') || localStorage.getItem('token') || localStorage.getItem('jwtToken');
        }

        async function validarAcesso() {
            const token = getTokenGlobal();
            if (!token) {
                window.location.replace('login.html');
                return;
            }

            try {
                const res = await fetch('/api/auth/me', { 
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (!res.ok) throw new Error("Sessão inválida ou expirada.");

                // Tela liberada!
                document.documentElement.style.display = '';

            } catch (error) {
                console.warn(error.message);
                localStorage.removeItem('futSumulaToken');
                localStorage.removeItem('token');
                window.location.replace('login.html'); 
            }
        }
        validarAcesso();
    </script>
    <script>
        (function() {
            const token = getTokenGlobal();
            const originalFetch = window.fetch;

            window.fetch = function() {
                let args = Array.from(arguments);
                let url = args[0];
                let options = args[1] || {};

                if (url.includes('/api/') && !url.includes('/auth/me') && !url.includes('/auth/login')) {
                    options.headers = options.headers || {};
                    options.headers['Authorization'] = 'Bearer ' + token;
                }
                args[1] = options;

                return originalFetch.apply(this, args).then(response => {
                    if (response.status === 403 || response.status === 401) {
                        alert("Sessão expirada. Por favor, faça login novamente.");
                        localStorage.removeItem('futSumulaToken');
                        localStorage.removeItem('token');
                        window.location.href = 'login.html';
                    }
                    return response;
                }).catch(err => {
                    console.error("Erro na requisição segura:", err);
                    throw err;
                });
            };
        })();
    </script>

    <!-- ESTILOS VISUAIS EXCLUSIVOS DO TORNEIOS.HTML -->
    <style>

    <div id="footbar-container"></div>

    <script src="js/images.js"></script>
    <script>
        // Carregador do Footbar
		fetch('footbar.html').then(r => r.text()).then(d => {
            const container = document.getElementById('footbar-container');
            container.innerHTML = d;
            
            // Extrai e executa o script injetado de forma segura
            const scripts = container.querySelectorAll("script");
            scripts.forEach(s => {
                const novoScript = document.createElement("script");
                novoScript.textContent = s.textContent;
                document.body.appendChild(novoScript);
            });
        });
				
        if (typeof AppImages === 'undefined') { var AppImages = { defaultAvatar: "https://cdn-icons-png.flaticon.com/512/21/21104.png" }; }
        const trophyIcons = ['fa-trophy', 'fa-award', 'fa-medal', 'fa-crown', 'fa-star', 'fa-shield-alt', 'fa-wine-glass', 'fa-gem', 'fa-ribbon', 'fa-certificate'];
        const mascotsMap = { 'lion': 'fa-paw', 'eagle': 'fa-feather-alt', 'shark': 'fa-fish', 'wolf': 'fa-dog', 'dragon': 'fa-dragon', 'bull': 'fa-bullhorn', 'horse': 'fa-horse', 'spider': 'fa-spider', 'cat': 'fa-cat', 'crow': 'fa-crow', 'frog': 'fa-frog', 'hippo': 'fa-hippo', 'otter': 'fa-otter', 'dove': 'fa-dove', 'kiwi': 'fa-kiwi-bird', 'worm': 'fa-worm', 'skull': 'fa-skull', 'bolt': 'fa-bolt', 'star': 'fa-star', 'anchor': 'fa-anchor', 'poo': 'fa-poop', 'restroom': 'fa-restroom', 'leaf': 'fa-leaf', 'cannabis': 'fa-cannabis', 'ghost': 'fa-ghost', 'alien': 'fa-pastafarianism', 'robot': 'fa-robot', 'bomb': 'fa-bomb', 'fire': 'fa-fire', 'crown': 'fa-crown' };

        let allTournaments = [];
        let processedTournaments = [];
        let currentTourneyId = null;

        document.addEventListener('DOMContentLoaded', loadTournaments);

        async function loadTournaments() {
            try {
                const response = await fetch('/api/torneios');
                if(!response.ok) throw new Error("Erro API");
                allTournaments = await response.json();
                
                processedTournaments = allTournaments.map(t => {
                    let matches = getMatches(t);
                    let completed = 0;
                    matches.forEach(m => { if(localStorage.getItem(`match_result_${t.id}_${m.id}`)) completed++; });
                    
                    const isFinished = (completed === matches.length && matches.length > 0);
                    let champion = null;

                    if(isFinished) {
                        if(t.tipo === 'MATA_MATA' || t.tipo === 'COPA') {
                            const finalMatch = matches.find(m => m.label === "GRANDE FINAL") || matches[matches.length-1];
                            if(finalMatch) {
                                const res = JSON.parse(localStorage.getItem(`match_result_${t.id}_${finalMatch.id}`));
                                if(res) champion = res.scoreHome > res.scoreAway ? (finalMatch.t1.nome || 'Vencedor') : (res.scoreAway > res.scoreHome ? (finalMatch.t2.nome || 'Vencedor') : 'Empate');
                            }
                        } else {
                            const ranking = calculateStandings(t, matches);
                            champion = ranking[0] ? ranking[0].nome : 'Indefinido';
                        }
                    }
                    return { ...t, isFinished, champion, completedMatches: completed, totalMatches: matches.length };
                });

                const totalEl = document.getElementById('total-tournaments');
                if (totalEl) totalEl.innerText = `${processedTournaments.length} TORNEIOS`;
                
                filtrarTorneios();
            } catch(e) { console.error(e); }
        }

        function getMatches(t) {
            const storageKey = `tourney_matches_${t.id}`;
            const stored = localStorage.getItem(storageKey);
            if(stored) return JSON.parse(stored);

            if (t.tipo !== 'LIGA') return [];

            let matches = [];
            let globalMatchIdCounter = 1;
            let groups = [t.times || []];

            groups.forEach((groupTimes, gIdx) => {
                const groupLabel = 'LIGA';
                const localTimes = [...groupTimes];
                if (localTimes.length % 2 !== 0) localTimes.push({ id: -1, nome: "BYE" });
                const numRounds = localTimes.length - 1;
                const half = localTimes.length / 2;

                for (let r = 0; r < numRounds; r++) {
                    for (let i = 0; i < half; i++) {
                        const t1 = localTimes[i];
                        const t2 = localTimes[localTimes.length - 1 - i];
                        if (t1 && t1.id !== -1 && t2 && t2.id !== -1) {
                            matches.push({ id: globalMatchIdCounter++, t1: t1, t2: t2, round: r + 1, label: groupLabel });
                        }
                    }
                    localTimes.splice(1, 0, localTimes.pop());
                }
                if (t.idaEVolta) {
                    const matchesIda = matches.filter(m => m.label.includes(groupLabel) && m.round <= numRounds);
                    matchesIda.forEach(m => {
                        matches.push({ id: globalMatchIdCounter++, t1: m.t2, t2: m.t1, round: m.round + numRounds, label: groupLabel });
                    });
                }
            });
            if (matches.length > 0) localStorage.setItem(storageKey, JSON.stringify(matches));
            return matches;
        }

        function calculateStandings(tournament, matches) {
            let stats = {};
            (tournament.times || []).forEach(t => { stats[t.id] = { ...t, P:0, J:0, V:0, E:0, D:0, GP:0, GC:0, SG:0, YC:0, RC:0 }; });

            matches.forEach(m => {
                const resKey = `match_result_${tournament.id}_${m.id}`;
                const r = localStorage.getItem(resKey) ? JSON.parse(localStorage.getItem(resKey)) : null;
                if (r && m.t1 && m.t2 && m.t1.id && m.t2.id && stats[m.t1.id] && stats[m.t2.id]) {
                    const home = stats[m.t1.id]; const away = stats[m.t2.id];
                    home.J++; away.J++;
                    home.GP += r.scoreHome; home.GC += r.scoreAway;
                    away.GP += r.scoreAway; away.GC += r.scoreHome;
                    home.SG = home.GP - home.GC; away.SG = away.GP - away.GC;
                    if (r.scoreHome > r.scoreAway) { home.V++; home.P += 3; away.D++; }
                    else if (r.scoreHome < r.scoreAway) { away.V++; away.P += 3; home.D++; }
                    else { home.E++; away.E++; home.P += 1; away.P += 1; }
                }
            });

            return Object.values(stats).sort((a, b) => {
                if (b.P !== a.P) return b.P - a.P;
                if (b.V !== a.V) return b.V - a.V;
                if (b.SG !== a.SG) return b.SG - a.SG;
                return b.GP - a.GP;
            });
        }

        function filtrarTorneios() {
            const termo = document.getElementById('search-tourney').value.toLowerCase();
            const status = document.getElementById('filter-status-tourney').value;
            
            const filtrados = processedTournaments.filter(t => {
                const nameMatch = t.nome.toLowerCase().includes(termo);
                let statusMatch = true;
                if(status === 'ACTIVE') statusMatch = !t.isFinished;
                if(status === 'FINISHED') statusMatch = t.isFinished;
                return nameMatch && statusMatch;
            });
            renderGrid(filtrados);
        }

        function renderGrid(list) {
            const grid = document.getElementById('tournaments-grid');
            grid.innerHTML = '';
            if(list.length === 0) { grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-gray);">Nenhum torneio encontrado.</div>`; return; }
            
            list.forEach(t => {
                const iconClass = trophyIcons[(t.modeloTrofeu || 1) - 1];
                const color = t.corTrofeu || '#FFD700';
                
                let footerHTML = '';
                let statusClass = '';
                let statusText = `<span class="t-status" style="color:var(--success-color);">EM ANDAMENTO (${t.completedMatches}/${t.totalMatches})</span>`;

                if(t.isFinished) {
                    statusClass = 'finished';
                    statusText = `<span class="t-status" style="color:#aaa;">FINALIZADO</span>`;
                    footerHTML = `<div class="champion-banner"><i class="fas fa-crown"></i> CAMPEÃO: ${t.champion}</div>`;
                }

                grid.innerHTML += `
                    <div class="tournament-card ${statusClass}" onclick="abrirMapa(${t.id})">
                        <div class="t-card-header" style="background-image: var(--img-stadium);">
                            <div class="t-card-overlay"></div>
                            <div class="t-type-badge">${t.tipo ? t.tipo.replace('_', ' ') : 'TORNEIO'}</div>
                            <i class="fas ${iconClass}" style="position: absolute; bottom: 10px; left: 15px; font-size: 2.5rem; color: ${color}; filter: drop-shadow(0 0 10px #000);"></i>
                        </div>
                        <div class="t-card-body">
                            <div class="t-title">${t.nome}</div>
                            <div class="t-info">
                                <span><i class="fas fa-users"></i> ${t.quantidadeTimes} Times</span>
                                ${statusText}
                            </div>
                        </div>
                        ${footerHTML}
                    </div>`;
            });
        }

        function getTeamIconHTML(team) {
            if (!team) return '';
            if (team.tipoEscudo === 'UPLOAD' && team.escudoUrl) return `<div class="tiny-crest"><img src="${team.escudoUrl}"></div>`;
            const icon = mascotsMap[team.customMascot] || 'fa-shield-alt';
            const grad = `linear-gradient(135deg, ${team.corPrimaria || '#333'}, ${team.corSecundaria || '#000'})`;
            const border = team.corTerciaria || '#fff';
            return `<div class="tiny-crest"><div class="tiny-custom-shape shape-${team.customShape || 'shield'}" style="background: ${grad}; border-color: ${border};"></div><i class="fas ${icon} tiny-custom-mascot" style="color: ${border};"></i></div>`;
        }

        // ROTEADOR QUE ENVIA A FLAG "source=torneios"
        function abrirMapa(id) {
            currentTourneyId = id;
            const t = processedTournaments.find(x => x.id === id);

            // Redireciona com o parâmetro indicando que veio da Galeria
            if (t.tipo === 'COPA') {
                window.location.href = `copadomundo.html?id=${t.id}&source=torneios`;
                return;
            } else if (t.tipo === 'MATA_MATA') {
                window.location.href = `matamata.html?id=${t.id}&source=torneios`;
                return;
            }

            // SE FOR LIGA (Modo Visual apenas)
            const iconClass = trophyIcons[(t.modeloTrofeu || 1) - 1];
            const color = t.corTrofeu || '#FFD700';
            let matches = getMatches(t);

            document.getElementById('modal-header-area').innerHTML = `
                <div class="tournament-header-big" style="border-bottom-color: ${color};">
                    <div class="rules-trigger" onclick="toggleRules(this)"><i class="fas fa-question"></i></div>
                    <div class="rules-popover" id="rulesPopover"><strong>Regulamento:</strong> LIGA - Pontos Corridos</div>
                    <i class="fas ${iconClass} th-trophy-icon" style="color: ${color}; filter: drop-shadow(0 0 10px ${color});"></i>
                    <h2 class="th-title">${t.nome}</h2>
                    <div class="th-subtitle">${t.tipo ? t.tipo.replace('_', ' ') : 'TORNEIO'} • ${t.quantidadeTimes} TIMES</div>
                </div>`;

            renderTVView(t, matches);
            const containerStructure = document.getElementById('tv-structure-area');
            containerStructure.innerHTML = gerarTabelaPontosCorridos(t, matches);
            document.getElementById('mapModal').classList.add('active');
        }

        function renderTVView(tournament, matches) {
            const container = document.getElementById('tv-broadcast-area');
            container.innerHTML = '';

            document.getElementById('tv-matches-title').innerHTML = `<span><i class="fas fa-tv"></i> CALENDÁRIO DE JOGOS</span> <span class="tv-count-badge">${matches.length} CONFRONTOS</span>`;
            if(matches.length === 0) { container.innerHTML = '<p style="text-align:center; color:#888;">Sem confrontos gerados.</p>'; return; }

            matches.forEach((m, idx) => {
                const icon1 = `<div class="tv-crest-wrapper">${getTeamIconHTML(m.t1)}</div>`;
                const icon2 = `<div class="tv-crest-wrapper">${getTeamIconHTML(m.t2)}</div>`;
                
                const resKey = `match_result_${tournament.id}_${m.id}`;
                const result = localStorage.getItem(resKey) ? JSON.parse(localStorage.getItem(resKey)) : null;

                if(result) {
                    container.innerHTML += `
                        <div class="tv-match-card" style="opacity: 0.8; cursor: default;">
                            <div class="tv-match-id" style="background:#555; color:#fff;">FIM</div>
                            <div class="tv-team home"><span>${m.t1.nome}</span> ${icon1}</div>
                            <div class="tv-vs" style="color:var(--primary-neon);">${result.scoreHome} - ${result.scoreAway}</div>
                            <div class="tv-team away">${icon2} <span>${m.t2.nome}</span></div>
                        </div>`;
                } else {
                    container.innerHTML += `
                        <div class="tv-match-card" style="cursor: default;">
                            <div class="tv-match-id">${m.label}</div>
                            <div class="tv-team home"><span>${m.t1.nome}</span> ${icon1}</div>
                            <div class="tv-vs">VS</div>
                            <div class="tv-team away">${icon2} <span>${m.t2.nome}</span></div>
                        </div>`;
                }
            });
        }

        function gerarTabelaPontosCorridos(tournament, matches) {
            const sortedStats = calculateStandings(tournament, matches);
            let rows = '';
            sortedStats.forEach((t, i) => {
                const icon = getTeamIconHTML(t);
                let rankClass = i===0 ? 'rank-1' : (i===1 ? 'rank-2' : (i===2 ? 'rank-3' : ''));
                rows += `<tr><td><span class="pos-rank ${rankClass}">${i+1}</span></td><td class="td-left" style="display:flex; align-items:center;">${icon} <span style="margin-left:5px;">${t.nome}</span></td><td class="val-pts" style="color:var(--primary-neon); font-weight:900;">${t.P}</td><td>${t.J}</td><td>${t.V}</td><td>${t.E}</td><td>${t.D}</td><td>${t.GP}</td><td>${t.GC}</td><td>${t.SG}</td><td class="val-warn">${t.YC}</td><td class="val-bad">${t.RC}</td></tr>`;
            });
            return `<div class="responsive-table-wrapper" style="overflow-x:auto;"><table class="big-table" style="width:100%; text-align:center; color:#fff;"><thead><tr><th style="text-align:center;">#</th><th style="text-align:left;">CLUBE</th><th>PTS</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th><i class="fas fa-square val-warn"></i></th><th><i class="fas fa-square val-bad"></i></th></tr></thead><tbody>${rows}</tbody></table></div>`;
        }

        function toggleRules(btn) { btn.nextElementSibling.classList.toggle('active'); }
        function confirmarExclusao1() { document.getElementById('mapModal').classList.remove('active'); document.getElementById('delModal1').classList.add('active'); }
        function confirmarExclusao2() { document.getElementById('delModal1').classList.remove('active'); document.getElementById('delModal2').classList.add('active'); }
        
        async function executarExclusao() {
            try {
                const response = await fetch(`/api/torneios/${currentTourneyId}`, { method: 'DELETE' });
                if(response.ok) { 
                    localStorage.removeItem(`tourney_matches_${currentTourneyId}`);
                    document.getElementById('delModal2').classList.remove('active'); 
                    loadTournaments(); 
                }
                else { alert("Erro ao excluir."); }
            } catch(e) { alert("Erro de conexão."); }
        }
    </script>
</body>
</html>
